<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hs-bindgen playground</title>
  <link rel="stylesheet" href="/static/vendor/codemirror.min.css" />
  <link rel="stylesheet" href="/static/vendor/hljs-theme.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>hs-bindgen playground</h1>
      <p class="tagline">Paste a C header, get Haskell bindings.
        <a href="https://github.com/well-typed/hs-bindgen">hs-bindgen</a></p>
    </div>
    <div id="versions" class="versions"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <section class="pane pane-input">
      <div class="controls">
        <label>Example
          <select id="examples"><option value="">— pick an example —</option></select>
        </label>
        <label>C standard
          <select id="std">
            <option>c89</option>
            <option>c99</option>
            <option selected>c11</option>
            <option>c17</option>
            <option>c23</option>
          </select>
        </label>
        <label>Foreign import
          <select id="safe">
            <option value="safe" selected>safe</option>
            <option value="unsafe">unsafe</option>
          </select>
        </label>
        <label>Verbosity
          <select id="verbosity">
            <option value="0">0 — error</option>
            <option value="1">1 — warning</option>
            <option value="2" selected>2 — notice</option>
            <option value="3">3 — info</option>
            <option value="4">4 — debug</option>
          </select>
        </label>
        <label class="check">
          <input id="macroWarnings" type="checkbox" checked />
          Macro warnings
        </label>
        <label>Module
          <input id="module" type="text" value="Demo" spellcheck="false" />
        </label>
        <label class="wide">
          <span>Additional options
            <button type="button" id="help-link" class="help-link" title="Accepted options">?</button></span>
          <input id="options" type="text" spellcheck="false"
                 placeholder="allowlisted preprocess flags, e.g. --select-all --hash-define FOO 1 (quotes group)" />
        </label>
      </div>
      <textarea id="source" spellcheck="false"></textarea>
      <div class="actions">
        <button id="generate">Generate bindings</button>
        <button id="share" type="button" title="Copy a link to this header and these options">Share</button>
        <span id="share-status" class="share-status"></span>
      </div>
    </section>

    <section class="pane pane-output">
      <nav class="tabs">
        <button class="tab active" data-tab="bindings">Bindings</button>
        <button class="tab" data-tab="diagnostics">Diagnostics</button>
        <button class="tab" data-tab="command">Command</button>
        <button class="tab" data-tab="help">Help</button>
      </nav>

      <div class="tab-panel active" data-panel="bindings">
        <button class="copy" data-copy="bindings-code">Copy</button>
        <pre><code id="bindings-code" class="language-haskell"></code></pre>
      </div>
      <div class="tab-panel" data-panel="diagnostics">
        <pre><code id="diagnostics-code"></code></pre>
      </div>
      <div class="tab-panel" data-panel="command">
        <button class="copy" data-copy="command-code">Copy</button>
        <pre><code id="command-code"></code></pre>
      </div>
      <div class="tab-panel" data-panel="help">
        <div class="help">
          <p>Flags accepted in <em>Additional options</em>, described by
            <code>hs-bindgen-cli preprocess --help</code>. The controls set the
            rest of the invocation; the Command tab shows it in full. See also the
            <a href="https://github.com/well-typed/hs-bindgen/tree/main/manual">manual</a>.</p>
          <dl id="help-options"></dl>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/vendor/codemirror.min.js"></script>
  <script src="/static/vendor/clike.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/haskell.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
